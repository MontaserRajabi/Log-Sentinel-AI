name: Build and deploy Python app to Azure Web App - Log-Sentinel-Ai

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Zip frontend source files
        run: |
          cd frontend
          zip -r ../app.zip .

      - name: Upload deployment zip
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ABA8ADC399CA423CA5456FEC3F20CC31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1F59533F6EB247FCBBCC995174C841C2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_64CDF56992DD40C695AE0C75AB75E7A4 }}

      - name: Get resource group
        id: rg
        run: |
          RG=$(az webapp list --query "[?name=='Log-Sentinel-Ai'].resourceGroup" -o tsv)
          echo "name=$RG" >> $GITHUB_OUTPUT

      - name: Stop web app (prevent SCM restart during build)
        run: az webapp stop --name Log-Sentinel-Ai --resource-group ${{ steps.rg.outputs.name }}

      - name: Cancel stuck deployment lock via Kudu API
        run: |
          TOKEN=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)
          SCM="https://log-sentinel-ai-h3bmh3hbh6e3c6bx.scm.francecentral-01.azurewebsites.net"
          # Cancel active deployment
          curl -s -X DELETE "$SCM/api/deployments/active" \
            -H "Authorization: Bearer $TOKEN" -o /dev/null || true
          # Delete deployment lock file if it exists
          curl -s -X DELETE "$SCM/api/vfs/site/locks/deployment.lock" \
            -H "Authorization: Bearer $TOKEN" -o /dev/null || true
          sleep 15

      - name: Deploy zip via Azure CLI
        run: |
          az webapp deploy \
            --name Log-Sentinel-Ai \
            --resource-group ${{ steps.rg.outputs.name }} \
            --src-path app.zip \
            --type zip \
            --async false

      - name: Start web app
        if: always()
        run: az webapp start --name Log-Sentinel-Ai --resource-group ${{ steps.rg.outputs.name }}
