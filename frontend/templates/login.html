<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log Sentinel AI — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:      #0a0e17;
    --panel:   #0f1623;
    --border:  #1a2540;
    --accent:  #00d4ff;
    --accent2: #0066ff;
    --danger:  #ff3b5c;
    --text:    #c8d8f0;
    --sub:     #4a6080;
    --mono:    'Share Tech Mono', monospace;
    --sans:    'Rajdhani', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sans);
    overflow: hidden;
  }

  /* Animated grid background */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events:none;
  }
  @keyframes gridMove { to { background-position: 40px 40px; } }

  /* Glow orb */
  body::after {
    content:'';
    position:fixed;
    width:500px; height:500px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(0,102,255,.12) 0%, transparent 70%);
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    pointer-events:none;
  }

  .card {
    position: relative;
    width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 48px 40px;
    box-shadow: 0 0 60px rgba(0,102,255,.1), 0 0 0 1px rgba(0,212,255,.05);
    animation: fadeUp .5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } }

  /* Corner decorations */
  .card::before, .card::after {
    content:'';
    position:absolute;
    width:16px; height:16px;
    border-color: var(--accent);
    border-style: solid;
  }
  .card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  .logo {
    text-align: center;
    margin-bottom: 36px;
  }
  .logo-icon {
    font-size: 2.4rem;
    display: block;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px var(--accent));
  }
  .logo h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .logo p {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--sub);
    letter-spacing: 3px;
    margin-top: 4px;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: rgba(0,212,255,.03);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: .95rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,.08);
  }

  .error {
    background: rgba(255,59,92,.08);
    border: 1px solid rgba(255,59,92,.3);
    border-radius: 2px;
    padding: 10px 14px;
    color: var(--danger);
    font-family: var(--mono);
    font-size: .78rem;
    margin-bottom: 18px;
    display: {% if error %} block {% else %} none {% endif %};
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 2px;
    color: #fff;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    margin-top: 8px;
  }
  .btn:hover  { opacity: .9; }
  .btn:active { transform: scale(.99); }

  .scan-line {
    position: absolute;
    left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 3s ease-in-out infinite;
    opacity:.4;
  }
  @keyframes scan {
    0%   { top:0;    opacity:0; }
    10%  { opacity:.4; }
    90%  { opacity:.4; }
    100% { top:100%; opacity:0; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="scan-line"></div>
  <div class="logo">
    <span class="logo-icon">🛡</span>
    <h1>Log Sentinel AI</h1>
    <p>INTRUSION DETECTION SYSTEM</p>
  </div>

  {% if error %}
  <div class="error">⚠ &nbsp;{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>// USERNAME</label>
      <input type="text" name="username" autocomplete="username" autofocus required/>
    </div>
    <div class="field">
      <label>// PASSWORD</label>
      <input type="password" name="password" autocomplete="current-password" required/>
    </div>
    <button class="btn" type="submit">Authenticate</button>
  </form>
</div>
</body>
</html>
