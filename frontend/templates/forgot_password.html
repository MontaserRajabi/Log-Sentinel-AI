<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LogSentinelAI — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#30363d;--accent:#17c3d8;--danger:#f85149;--success:#3fb950;--text:#e6edf3;--muted:#8b949e;--font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--font);position:relative;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(23,195,216,0.06) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;}
body::after{content:'';position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(23,195,216,0.06) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
.card{position:relative;width:420px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px 36px 36px;box-shadow:0 0 0 1px rgba(23,195,216,0.04),0 24px 64px rgba(0,0,0,0.4);z-index:1;animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}}
.card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:0 0 2px 2px;opacity:0.6;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.brand svg{width:34px;height:34px;}
.brand-name{font-size:1rem;font-weight:700;color:var(--text);letter-spacing:-0.3px;}
.brand-name em{color:var(--accent);font-style:normal;}
.brand-sub{font-size:0.6rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);margin-top:1px;}
.page-heading{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:6px;}
.page-sub{font-size:0.82rem;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.alert-box{border-radius:8px;padding:11px 14px;font-size:0.82rem;margin-bottom:20px;display:flex;align-items:flex-start;gap:8px;}
.alert-box.ok{background:rgba(63,185,80,0.08);border:1px solid rgba(63,185,80,0.28);color:var(--success);}
.alert-box.err{background:rgba(248,81,73,0.08);border:1px solid rgba(248,81,73,0.28);color:var(--danger);}
.field{margin-bottom:18px;}
.field label{display:block;font-size:0.74rem;font-weight:600;color:var(--muted);letter-spacing:0.3px;text-transform:uppercase;margin-bottom:7px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font);font-size:0.9rem;outline:none;transition:border-color .15s,box-shadow .15s;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,195,216,0.1);}
.btn{width:100%;padding:11px;background:var(--accent);border:none;border-radius:8px;color:#0d1117;font-family:var(--font);font-size:0.9rem;font-weight:700;cursor:pointer;transition:filter .15s;margin-top:4px;}
.btn:hover{filter:brightness(1.1);}
.back-link{display:block;text-align:center;margin-top:20px;font-size:0.8rem;color:var(--muted);text-decoration:none;transition:color .15s;}
.back-link:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
      <circle cx="5"  cy="11" r="2.3" fill="#17c3d8" opacity=".85"/><circle cx="5"  cy="23" r="2.3" fill="#17c3d8" opacity=".6"/>
      <circle cx="17" cy="5"  r="2.3" fill="#17c3d8" opacity=".8"/><circle cx="17" cy="17" r="3.2" fill="#17c3d8"/>
      <circle cx="17" cy="29" r="2.3" fill="#17c3d8" opacity=".6"/><circle cx="29" cy="11" r="2.3" fill="#17c3d8" opacity=".85"/>
      <circle cx="29" cy="23" r="2.3" fill="#17c3d8" opacity=".6"/>
      <line x1="5" y1="11" x2="17" y2="11" stroke="#17c3d8" stroke-width="1.4" opacity=".5"/>
      <line x1="5" y1="23" x2="17" y2="23" stroke="#17c3d8" stroke-width="1.4" opacity=".4"/>
      <line x1="17" y1="5" x2="17" y2="29" stroke="#17c3d8" stroke-width="1.4" opacity=".4"/>
      <line x1="17" y1="11" x2="29" y2="11" stroke="#17c3d8" stroke-width="1.4" opacity=".5"/>
      <line x1="17" y1="23" x2="29" y2="23" stroke="#17c3d8" stroke-width="1.4" opacity=".4"/>
    </svg>
    <div>
      <div class="brand-name">Log<em>Sentinel</em>AI</div>
      <div class="brand-sub">Security Platform</div>
    </div>
  </div>

  <h1 class="page-heading">Reset Password</h1>
  <p class="page-sub">Enter the email address linked to your account and we'll send you a reset link.</p>

  {% if message %}
  <div class="alert-box ok">&#10003; &nbsp;{{ message }}</div>
  {% endif %}
  {% if error %}
  <div class="alert-box err">&#9888; &nbsp;{{ error }}</div>
  {% endif %}

  {% if not message %}
  <form method="POST">
    <div class="field">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="your@email.com" autofocus required/>
    </div>
    <button class="btn" type="submit">Send Reset Link</button>
  </form>
  {% endif %}

  <a class="back-link" href="/login">&larr; Back to Sign In</a>
</div>
</body>
</html>
