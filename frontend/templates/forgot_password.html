<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log Sentinel AI — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0e17; --panel:#0f1623; --border:#1a2540;
    --accent:#00d4ff; --accent2:#0066ff; --danger:#ff3b5c;
    --ok:#00e676; --text:#c8d8f0; --sub:#4a6080;
    --mono:'Share Tech Mono',monospace; --sans:'Rajdhani',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans);
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);
    background-size:40px 40px; animation:gridMove 20s linear infinite; pointer-events:none;
  }
  @keyframes gridMove { to { background-position:40px 40px; } }
  .card {
    position:relative; width:400px; background:var(--panel);
    border:1px solid var(--border); border-radius:4px; padding:48px 40px;
    box-shadow:0 0 60px rgba(0,102,255,.1),0 0 0 1px rgba(0,212,255,.05);
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } }
  .card::before,.card::after { content:''; position:absolute; width:16px; height:16px; border-color:var(--accent); border-style:solid; }
  .card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
  .scan-line {
    position:absolute; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:scan 3s ease-in-out infinite; opacity:.4;
  }
  @keyframes scan { 0%{top:0;opacity:0} 10%{opacity:.4} 90%{opacity:.4} 100%{top:100%;opacity:0} }
  .logo { text-align:center; margin-bottom:32px; }
  .logo-icon { font-size:2rem; display:block; margin-bottom:8px; filter:drop-shadow(0 0 10px var(--accent)); }
  .logo h1 { font-size:1.4rem; font-weight:700; color:var(--text); letter-spacing:2px; text-transform:uppercase; }
  .logo p  { font-family:var(--mono); font-size:.68rem; color:var(--sub); letter-spacing:3px; margin-top:4px; }
  .field { margin-bottom:18px; }
  .field label { display:block; font-family:var(--mono); font-size:.68rem; color:var(--accent); letter-spacing:2px; margin-bottom:7px; }
  .field input {
    width:100%; background:rgba(0,212,255,.03); border:1px solid var(--border);
    border-radius:2px; padding:11px 13px; color:var(--text);
    font-family:var(--mono); font-size:.92rem; outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.08); }
  .btn {
    width:100%; padding:12px; background:linear-gradient(135deg,var(--accent2),var(--accent));
    border:none; border-radius:2px; color:#fff; font-family:var(--sans);
    font-size:.95rem; font-weight:700; letter-spacing:3px; text-transform:uppercase;
    cursor:pointer; transition:opacity .2s; margin-top:6px;
  }
  .btn:hover { opacity:.9; }
  .hint { font-family:var(--mono); font-size:.72rem; color:var(--sub); margin-bottom:22px; line-height:1.6; }
  .alert { border-radius:2px; padding:10px 14px; font-family:var(--mono); font-size:.78rem; margin-bottom:18px; }
  .alert.ok  { background:rgba(0,230,118,.08); border:1px solid rgba(0,230,118,.3); color:var(--ok); }
  .alert.err { background:rgba(255,59,92,.08);  border:1px solid rgba(255,59,92,.3);  color:var(--danger); }
  .back-link {
    display:block; text-align:center; margin-top:20px;
    font-family:var(--mono); font-size:.72rem; color:var(--sub);
    text-decoration:none; letter-spacing:1px; transition:color .2s;
  }
  .back-link:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="scan-line"></div>
  <div class="logo">
    <span class="logo-icon">&#128274;</span>
    <h1>Log Sentinel AI</h1>
    <p>// RESET ACCESS</p>
  </div>

  {% if message %}
  <div class="alert ok">&#10003; &nbsp;{{ message }}</div>
  {% endif %}
  {% if error %}
  <div class="alert err">&#9888; &nbsp;{{ error }}</div>
  {% endif %}

  {% if not message %}
  <p class="hint">Enter the email address linked to your account.<br>We'll send you a reset link.</p>
  <form method="POST">
    <div class="field">
      <label>// EMAIL ADDRESS</label>
      <input type="email" name="email" placeholder="your@email.com" autofocus required/>
    </div>
    <button class="btn" type="submit">Send Reset Link</button>
  </form>
  {% endif %}

  <a class="back-link" href="/login">&#8592; Back to Login</a>
</div>
</body>
</html>
