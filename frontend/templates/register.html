<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log Sentinel AI — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#0a0e17; --panel:#0f1623; --border:#1a2540;
    --accent:#00d4ff; --accent2:#0066ff; --danger:#ff3b5c;
    --ok:#00e676; --text:#c8d8f0; --sub:#4a6080;
    --mono:'Share Tech Mono',monospace; --sans:'Rajdhani',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);
    background-size:40px 40px; animation:gridMove 20s linear infinite; pointer-events:none;
  }
  @keyframes gridMove { to { background-position:40px 40px; } }
  body::after {
    content:''; position:fixed;
    width:500px; height:500px; border-radius:50%;
    background:radial-gradient(circle,rgba(0,102,255,.12) 0%,transparent 70%);
    top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none;
  }
  .card {
    position:relative; width:420px; background:var(--panel);
    border:1px solid var(--border); border-radius:4px; padding:48px 40px;
    box-shadow:0 0 60px rgba(0,102,255,.1),0 0 0 1px rgba(0,212,255,.05);
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } }
  .card::before,.card::after {
    content:''; position:absolute; width:16px; height:16px;
    border-color:var(--accent); border-style:solid;
  }
  .card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
  .scan-line {
    position:absolute; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:scan 3s ease-in-out infinite; opacity:.4;
  }
  @keyframes scan { 0%{top:0;opacity:0} 10%{opacity:.4} 90%{opacity:.4} 100%{top:100%;opacity:0} }
  .logo { text-align:center; margin-bottom:32px; }
  .logo-icon { font-size:2.4rem; display:block; margin-bottom:10px; filter:drop-shadow(0 0 12px var(--accent)); }
  .logo h1 { font-size:1.5rem; font-weight:700; color:var(--text); letter-spacing:2px; text-transform:uppercase; }
  .logo p  { font-family:var(--mono); font-size:.7rem; color:var(--sub); letter-spacing:3px; margin-top:4px; }
  .field { margin-bottom:18px; }
  .field label {
    display:block; font-family:var(--mono); font-size:.7rem;
    color:var(--accent); letter-spacing:2px; margin-bottom:8px;
  }
  .field input {
    width:100%; background:rgba(0,212,255,.03); border:1px solid var(--border);
    border-radius:2px; padding:12px 14px; color:var(--text);
    font-family:var(--mono); font-size:.95rem; outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.08); }
  .hint {
    font-family:var(--mono); font-size:.65rem; color:var(--sub);
    margin-top:5px; letter-spacing:.5px;
  }
  .btn {
    width:100%; padding:13px; background:linear-gradient(135deg,var(--accent2),var(--accent));
    border:none; border-radius:2px; color:#fff; font-family:var(--sans);
    font-size:1rem; font-weight:700; letter-spacing:3px; text-transform:uppercase;
    cursor:pointer; transition:opacity .2s,transform .1s; margin-top:6px;
  }
  .btn:hover { opacity:.9; } .btn:active { transform:scale(.99); }
  .alert {
    border-radius:2px; padding:10px 14px; font-family:var(--mono);
    font-size:.78rem; margin-bottom:18px;
  }
  .alert.err { background:rgba(255,59,92,.08); border:1px solid rgba(255,59,92,.3); color:var(--danger); }
  .divider {
    display:flex; align-items:center; gap:12px;
    margin:22px 0 18px; color:var(--sub);
    font-family:var(--mono); font-size:.65rem; letter-spacing:2px;
  }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .signin-link {
    display:block; text-align:center;
    font-family:var(--mono); font-size:.72rem; color:var(--sub);
    text-decoration:none; letter-spacing:1px; transition:color .2s;
  }
  .signin-link:hover { color:var(--accent); }

  .pw-rules {
    margin-top:8px; padding:10px 12px;
    background:rgba(0,0,0,.2); border:1px solid var(--border); border-radius:2px;
    display:none;
  }
  .pw-rules.visible { display:block; }
  .rule {
    font-family:var(--mono); font-size:.65rem; color:var(--danger);
    letter-spacing:.5px; padding:2px 0; transition:color .2s;
  }
  .rule.ok { color:var(--ok); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="scan-line"></div>
  <div class="logo">
    <span class="logo-icon">&#128737;</span>
    <h1>Log Sentinel AI</h1>
    <p>// CREATE ACCOUNT</p>
  </div>

  {% if error %}
  <div class="alert err">&#9888; &nbsp;{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>// USERNAME</label>
      <input type="text" name="username" autocomplete="username"
             autofocus required minlength="3" maxlength="32"
             pattern="[A-Za-z0-9_\-]+" title="Letters, numbers, _ and - only"
             value="{{ form_username }}"/>
      <div class="hint">3–32 chars &nbsp;·&nbsp; letters, numbers, _ -</div>
    </div>
    <div class="field">
      <label>// EMAIL ADDRESS</label>
      <input type="email" name="email" autocomplete="email"
             required placeholder="your@email.com"
             value="{{ form_email }}"/>
      <div class="hint">Used for password recovery</div>
    </div>
    <div class="field">
      <label>// PASSWORD</label>
      <input type="password" name="password" id="pw" autocomplete="new-password"
             required minlength="8" oninput="checkPw()"/>
      <div class="pw-rules" id="pw-rules">
        <div class="rule" id="r-len">✗ &nbsp;At least 8 characters</div>
        <div class="rule" id="r-num">✗ &nbsp;At least one number</div>
        <div class="rule" id="r-sym">✗ &nbsp;At least one symbol (!@#$%^&*…)</div>
        <div class="rule" id="r-match">✗ &nbsp;Passwords match</div>
      </div>
    </div>
    <div class="field">
      <label>// CONFIRM PASSWORD</label>
      <input type="password" name="confirm_password" id="pw2" autocomplete="new-password"
             required oninput="checkPw()"/>
    </div>
    <button class="btn" type="submit" id="submit-btn" disabled>Create Account</button>
  </form>

  <div class="divider">or</div>
  <a class="signin-link" href="/login">&#8592; Already have an account? Sign in</a>
</div>
<script>
function checkPw() {
  const pw    = document.getElementById('pw').value;
  const pw2   = document.getElementById('pw2').value;
  const rules = document.getElementById('pw-rules');
  const btn   = document.getElementById('submit-btn');

  if (pw.length > 0) rules.classList.add('visible');

  const okLen   = pw.length >= 8;
  const okNum   = /\d/.test(pw);
  const okSym   = /[!@#$%^&*()\-_=+\[\]{};:'",.<>/?\\|`~]/.test(pw);
  const okMatch = pw.length > 0 && pw === pw2;

  function set(id, ok) {
    const el = document.getElementById(id);
    el.classList.toggle('ok', ok);
    el.textContent = (ok ? '✓' : '✗') + el.textContent.slice(1);
  }
  set('r-len',   okLen);
  set('r-num',   okNum);
  set('r-sym',   okSym);
  set('r-match', okMatch);

  btn.disabled = !(okLen && okNum && okSym && okMatch);
}
</script>
</body>
</html>
